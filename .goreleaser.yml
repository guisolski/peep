version: 2

builds:
  - id: peep
    main: .
    binary: peep
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: guisolski
    name: peep

brews:
  - name: peep
    repository:
      owner: guisolski
      name: peep
      branch: main
    directory: Formula
    homepage: "https://github.com/guisolski/peep"
    description: "A terminal UI for exploring JSON"
    license: "MIT"
    install: |
      bin.install "peep"
    test: |
      system "#{bin}/peep --version"
